  <path class="rel" d="M837 315 L837 390"/><text x="850" y="360" class="note">1 a *</text>
  <path class="rel" d="M505 315 L505 405"/><text x="520" y="365" class="note">1 a 1</text>
  <path class="rel" d="M505 531 L505 610"/><text x="520" y="575" class="note">1 a *</text>
  <path class="rel" d="M635 662 L700 545"/><text x="642" y="620" class="note">* a 1</text>
  <path class="rel" d="M380 230 C250 280 183 325 183 405"/><text x="230" y="335" class="note">1 a *</text>
  <path class="rel" d="M700 270 C560 330 305 340 215 405"/><text x="450" y="345" class="note">1 a *</text>
  <path class="rel" d="M183 575 L183 650"/><text x="198" y="620" class="note">1 a *</text>
  <path class="rel" d="M305 720 C450 660 585 600 700 530"/><text x="470" y="655" class="note">* a 1</text>
  <path class="rel" d="M183 575 L183 855"/><text x="198" y="830" class="note">1 a 0..1</text>
  <path class="rel" d="M305 515 C360 600 420 700 505 790"/><text x="365" y="690" class="note">1 a *</text>
  <path class="rel" d="M635 710 L700 710"/><text x="648" y="696" class="note">* reseña</text>
  <path class="rel" d="M975 710 L1090 715"/><text x="1000" y="700" class="note">reporta</text>
</svg>
